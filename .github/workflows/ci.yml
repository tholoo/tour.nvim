name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Neovim 0.13 and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Run tests, lint, examples, and repository checks
        run: nix flake check --print-build-logs
      - name: Build plugin and standalone authoring skill
        run: nix build .#tour-nvim .#tour-skill --no-link --print-build-logs
      - name: Scan full Git history for secrets
        run: nix develop --command gitleaks git --redact --no-banner --log-opts=--all .
